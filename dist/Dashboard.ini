# Local Control Center configuration loaded with ConfigReader.
# Setting names are intentionally flat and descriptive.
# Service ports must match the corresponding Server.ini files.
# =============================================================================


# -----------------------------------------------------------------------------
# MONITORING
# -----------------------------------------------------------------------------

# How often the Control Center checks Login Server and Game Server process/port health.
# Milliseconds. Valid range: 250-10000. Default: 1000.
MonitorHealthCheckMs = 1000

# How often JVM telemetry is collected while a visible page needs it.
# Milliseconds. Valid range: 500-60000. Default: 2000.
MonitorTelemetryMs = 2000


# -----------------------------------------------------------------------------
# CONSOLE
# -----------------------------------------------------------------------------

# Maximum console messages retained per managed service.
# Older messages are discarded from the central history. Default: 10000.
ConsoleMaxLines = 10000


# -----------------------------------------------------------------------------
# TELEMETRY HISTORY
# -----------------------------------------------------------------------------

# Maximum telemetry samples retained for each history chart.
# At 2000 ms, 1800 samples represent about 60 minutes. Default: 1800.
TelemetryHistorySamples = 1800


# -----------------------------------------------------------------------------
# ALERTS
# -----------------------------------------------------------------------------

# CPU usage percentage that triggers a warning. Default: 90.
AlertCpuPercent = 90

# JVM heap usage percentage that triggers a warning. Default: 85.
AlertHeapPercent = 85

# Minimum free disk percentage before a warning is displayed. Default: 10.
AlertDiskFreePercent = 10


# -----------------------------------------------------------------------------
# SERVICE CONTROL
# -----------------------------------------------------------------------------

# Maximum time to wait for a managed service to stop gracefully. Seconds. Default: 30.
ServiceShutdownTimeoutSeconds = 30

# Start Login Server automatically when Game Server requires it.
ServiceAutoStartLogin = True

# Optional full path to the Java executable used to launch managed services.
# Leave empty to use JAVA_HOME or the Java runtime running the Control Center.
ServiceJavaPath =


# -----------------------------------------------------------------------------
# LOCAL MANAGEMENT
# -----------------------------------------------------------------------------

# Authentication token used by the local management MXBean.
# Generated automatically when empty. Keep this value private.
ManagementControlToken =


# -----------------------------------------------------------------------------
# SERVICE PORTS
# -----------------------------------------------------------------------------

# Login Server client port fallback. Must match LoginserverPort. Default: 2106.
LoginPort = 2106

# Game Server client port fallback. Must match GameserverPort. Default: 7777.
GamePort = 7777


# -----------------------------------------------------------------------------
# INTERFACE
# -----------------------------------------------------------------------------

# Width of the left navigation panel in pixels. Default: 190.
NavigationWidth = 190


# -----------------------------------------------------------------------------
# MAP EXTRACTOR
# -----------------------------------------------------------------------------

# Last selected Lineage II client root.
MapExtractorClientPath =

# Optional reference geodata directory.
MapExtractorReferenceGeodataPath =

# Output directory. Leave empty to use game/data/geodata.
MapExtractorOutputPath =

# Generate .l2j geodata files.
MapExtractorGenerateGeodata = True

# Generate door XML when supported by the selected client data.
MapExtractorGenerateDoors = False

# Generate water-zone XML when supported by the selected client data.
MapExtractorGenerateWater = False

# Preferred detected map variant suffix. Leave empty for the standard map set.
MapExtractorMapVariant =


# -----------------------------------------------------------------------------
# WINDOW
# -----------------------------------------------------------------------------

# Saved horizontal window position. Use -1 for automatic placement.
WindowX = -1

# Saved vertical window position. Use -1 for automatic placement.
WindowY = -1

# Saved Control Center width in pixels. Default: 1440.
WindowWidth = 1440

# Saved Control Center height in pixels. Default: 860.
WindowHeight = 860

# Restore the Control Center maximized on the next launch.
WindowMaximized = False
