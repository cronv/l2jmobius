<html noscrollbar>
<body>
<table width=700><tr><td height=10></td></tr></table>
<table width=20>
	<tr>
		<td>%navigation%</td>
		<td>
			<center>
				<table border=0 cellpadding=0 cellspacing=0 width=555 background="L2UI_CT1.Windows_DF_TooltipBG">
					<tr><td height=10></td></tr>
					<tr><td align=center><font name="hs12" color="CDB67F">%name%</font></td></tr>
					<tr><td align=center>Status: %status%</td></tr>
					<tr><td align=center>Registered: <font color="LEVEL">%count%</font></td></tr>
					<tr><td align=center>Minimum to start: <font color="FF9900">%min%</font></td></tr>
					<tr><td align=center>Level range: %levels%</td></tr>
					<tr><td align=center>Следующий ивент: %next%</td></tr>
					<tr><td height=15></td></tr>
					<tr><td align=center>%button%</td></tr>
					<tr><td align=center><a action="bypass _bbsevents">Back to list</a></td></tr>
					<tr><td height=15></td></tr>
				</table>
			</center>
		</td>
	</tr>
</table>
</body>
</html>
