# ---------------------------------------------------------------------------
# Giran Zone Effect
# ---------------------------------------------------------------------------
# Change Giran client effect.
# Available effects: Normal, Petals, Snow, Flowers, Water, Autumn.

# Fallback effect during day time.
# Used when both GiranCalendarEffect and GiranSeasonEffect are False,
# or when no calendar entry matches today's date.
GiranDayEffect = Normal

# Fallback effect during night time.
GiranNightEffect = Flowers

# ---------------------------------------------------------------------------
# Giran Season Effect
# ---------------------------------------------------------------------------
# When True, the effect is driven by the current real-world meteorological
# season (Northern Hemisphere, fixed month boundaries):
#   Spring : Mar 01 - May 31
#   Summer : Jun 01 - Aug 31
#   Autumn : Sep 01 - Nov 30
#   Winter : Dec 01 - Feb 28/29
#
# Day/night still applies: each season has its own day effect and night effect.
# Custom calendar entries (below) take priority over season values when matched.
GiranSeasonEffect = True

# Season day/night effects.
# Format: <Season>DayEffect and <Season>NightEffect
GiranSpringDayEffect = Flowers
GiranSpringNightEffect = Petals

GiranSummerDayEffect = Water
GiranSummerNightEffect = Normal

GiranAutumnDayEffect = Autumn
GiranAutumnNightEffect = Normal

GiranWinterDayEffect = Snow
GiranWinterNightEffect = Snow

# ---------------------------------------------------------------------------
# Giran Calendar Effect (custom date-range overrides)
# ---------------------------------------------------------------------------
# When True, specific date ranges override the season (and fallback) effects.
# Day/night still applies within each override entry.
# Entries are checked top-to-bottom; the first matching range wins.
# If no entry matches, the season (or fallback) logic is used instead.
GiranCalendarEffect = True

# Entry format (semicolon-separated list):
#   MMM dd-MMM dd=<DayEffect>/<NightEffect>
#
# Month abbreviations : Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec
# Day numbers must be zero-padded (01, 02 ... 31).
# Year-wrapping ranges are supported (e.g. Dec 20-Jan 05).
# DayEffect and NightEffect are separated by a forward slash.
#
# Example – Christmas event overrides Winter season for a tighter window,
#           Valentine's gets petals all day and night:
#
GiranCalendarEntries = Dec 20-Jan 05=Snow/Snow;Feb 01-Feb 14=Petals/Petals;Oct 25-Nov 01=Autumn/Normal


# ---------------------------------------------------------------------------
# Mount Restrictions During Sieges
# ---------------------------------------------------------------------------

# Allow riding wyvern ignoring 7 Signs status.
# This will allow Castle Lords to ride wyvern even when Dusk has won Seal of Strife.
# Default: False
AllowRideWyvernAlways = False

# Allow riding wyvern during Castle/Fort Siege.
# All players are restricted from riding wyverns during a siege.
# However, the castle lord (clan leader who owns the castle being sieged) is still allowed to ride a wyvern during the siege.
# This matches official behavior.
# Default: False
AllowRideWyvernDuringSiege = False

# Allow riding mounts (wyvern excluded) during Castle/Fort Siege.
# Default: False
AllowRideMountsDuringSiege = False
