# ---------------------------------------------------------------------------
# Aerial Cleft
# ---------------------------------------------------------------------------

# Enable the Aerial Cleft event.
# Default: True
AerialCleftEnabled = True

# Minimum level required to register.
# Default: 75
MinimumLevel = 75

# Minimum amount of players per team required to start the battle.
# Default: 9
MinimumTeamPlayers = 9

# Maximum amount of players allowed in the battle.
# Default: 18
MaximumPlayers = 18

# Battle duration. (in minutes)
# Default: 25
EventTime = 25

# Time the winning team is given to collect star stones once the battle ends. (in minutes)
# Default: 5
CollectTime = 5

# Time the battlefield stays closed once a battle ends. (in minutes)
# Default: 60
ReloadTime = 60

# Resurrection delay during the battle. (in seconds)
# Default: 10
RespawnDelay = 10

# Points awarded for destroying the central compressor.
# Default: 100
LargeCompressorPoints = 100

# Points awarded for destroying a stronghold compressor.
# Default: 40
SmallCompressorPoints = 40

# Points awarded for killing the enemy Combat Aerial Target.
# Default: 10
CatPoints = 10

# Points awarded for killing an enemy player.
# Default: 1
PlayerPoints = 1

# Item rewarded to the participants.
# Default: 13749 (Emery Piece)
RewardId = 13749

# Item amount rewarded to each member of the winning team.
# Default: 50
RewardCountWinner = 50

# Item amount rewarded to each member of the losing team.
# Default: 20
RewardCountLoser = 20

# Minimum time spent in the battle required to receive a reward. (in minutes)
# Default: 15
MinimumParticipationTime = 15
