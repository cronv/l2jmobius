# ---------------------------------------------------------------------------
# Illusory Equipment Event Settings
# ---------------------------------------------------------------------------
# The defaults are set to be retail-like. If you modify any of these settings your server will deviate from being retail-like.
# WARNING: Please take extreme caution when changing anything. Also please understand what you are changing before you do so on a live server.


# Enable the Illusory Equipment Event.
Enabled = False

# Illusory Equipment Event Start Date
# Start date is set in global variables when you start the server with event enabled

# Illusory Equipment Event Duration.
# Default: 5 months
# Calculation is made inside the packet: value set here * 2592000000 (30 days in milliseconds)
Duration = 5

# Enable detailed player message for debug purpose.
# Default: False
Debug = False

# The maximum number of points a character may spend, by level range.
# Format: fromLevel-toLevel,points separated by ;
# Levels no range covers may spend nothing. Coupon items raise the limit on top of this.
# Default: 1-109,500;110-115,300;116-119,100;120-200,0
PointsLimitByLevel = 1-109,500;110-115,300;116-119,100;120-200,0

# The highest the coupon items may lift the point limit of a character.
# The level limit above is the base, this caps only what coupons add on top of it.
# Zero lets coupons raise it without end.
# Default: 0
PointsBonusLimit = 0

# Let the raised limit bought with Illusory Equipment Points Coupon outlive the season.
# Retail deletes everything of the system at the end of a season, this keeps only that raised limit,
# so a player who spent coupons starts the next season with the higher cap. The coupon items themselves
# are still taken away, along with every point and every piece of illusory equipment.
# Default: False
KeepBonusPointsOnSeasonEnd = False
