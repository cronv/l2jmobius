# ---------------------------------------------------------------------------
# PIN Security
# ---------------------------------------------------------------------------
# Enables the PIN Security system.
# When enabled, each player is locked after entering the world until the PIN is created or validated.
# While locked, gameplay actions are blocked and only the required PIN bypass, restart, logout, net ping and game guard packets are allowed.
# Default: True
PinSecurityEnabled = False

# Defines how the PIN Security is stored.
# Account = one PIN protects all characters from the same account.
# Character = each character has its own independent PIN.
# Default: Account
# Values: Account, Character
PinSecurityScope = Account

# Minimum amount of numeric digits required for the PIN.
# Lower values are easier to remember but weaker against guessing attempts.
# Default: 4
# Recommended: 4
PinSecurityMinLength = 4

# Maximum amount of numeric digits allowed for the PIN.
# Higher values allow stronger PINs but can be less convenient for players.
# Default: 8
# Recommended: 8
PinSecurityMaxLength = 8

# Maximum number of failed PIN attempts before applying a temporary lock.
# After reaching this limit, the player must wait before trying again.
# Default: 5
# Recommended: 5
PinSecurityMaxAttempts = 5

# Duration in minutes of the temporary lock after reaching the failed attempt limit.
# Example: 15 = the player must wait 15 minutes before entering another PIN.
# Default: 15
# Recommended: 15
PinSecurityLockMinutes = 15